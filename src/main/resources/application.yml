server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: despacha-facil-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  frontend-urls:
    - "https://despachafacil.com"
    - "https://www.despachafacil.com"
    - "https://app.despachafacil.com"
    - "http://localhost:3000"

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@despachafacil.com}

meta:
  whatsapp:
    token: ${META_WHATSAPP_TOKEN:}
    phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}

cloudflare:
  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
    secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME:despacha-facil-storage}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

logging:
  level:
    root: INFO
    com.despachafacil.api: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO

